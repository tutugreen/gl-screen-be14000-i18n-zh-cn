name: Build IPK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IBM_PLEX_SC_TAG: "@ibm/plex-sans-sc@1.1.0"
  OPENWRT_IPKG_BUILD_COMMIT: "07a5e432c83aa5c5b8ef21caf84fc1d051dfcadc"
  TARGET_DEVICE: "GL-BE14000"
  TARGET_FIRMWARE: "4.9.2 (build number not established)"
  TARGET_OPENWRT: "21.02-SNAPSHOT"

jobs:
  build:
    if: github.actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
      artifact-name: gl-screen-be14000-i18n-zh-cn-${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache IBM Plex Sans SC zip
        uses: actions/cache@v4
        with:
          path: assets/cache/ibm-plex-sans-sc/ibm-plex-sans-sc.zip
          key: ibm-plex-sans-sc-${{ env.IBM_PLEX_SC_TAG }}

      - name: Install deps
        run: |
          curl -fsSL "https://raw.githubusercontent.com/openwrt/openwrt/${OPENWRT_IPKG_BUILD_COMMIT}/scripts/ipkg-build" -o /tmp/ipkg-build
          chmod +x /tmp/ipkg-build
          sudo install -m 0755 /tmp/ipkg-build /usr/local/bin/ipkg-build
          pip install -r requirements.txt

      - name: Prepare overlay
        run: python scripts/prepare_overlay.py

      - name: Validate zh_cn keys
        run: python scripts/validate_zh_cn.py

      - name: Build ipk
        id: build
        run: |
          VERSION=$(date -u +%Y.%m.%d.%H%M%S)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python scripts/build_ipk.py --version "$VERSION"

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: gl-screen-be14000-i18n-zh-cn-${{ steps.build.outputs.version }}
          path: dist/*.ipk
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    permissions:
      contents: write
    steps:
      - name: Download ipk
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          IPK_PATH=$(find dist -maxdepth 1 -name '*.ipk' -print -quit)
          SCREEN_DEPENDS=$(tar -xOf "$IPK_PATH" ./control.tar.gz | tar -xzOf - ./control | sed -n 's/^Depends: //p')
          {
            echo "Automated IPK build for GL-BE14000 screen zh-CN language pack."
            echo
            echo "## Compatibility"
            echo "- Device: ${TARGET_DEVICE}"
            echo "- GL.iNet firmware: ${TARGET_FIRMWARE}"
            echo "- OpenWrt base: ${TARGET_OPENWRT}"
            echo "- Original screen package: ${SCREEN_DEPENDS}"
          } > /tmp/release-notes.md
          gh release create "v${VERSION}" dist/*.ipk \
            --repo "$GITHUB_REPOSITORY" \
            --title "gl-screen-be14000-i18n-zh-cn ${VERSION}" \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/release-notes.md \
            --latest
